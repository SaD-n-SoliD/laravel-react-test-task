services:
  # База данных MySQL
  db:
    image: mysql:8.0
    container_name: blog_db
    restart: unless-stopped
    tty: true
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: blog
      MYSQL_ROOT_PASSWORD: password
      MYSQL_USER: blog_user
      MYSQL_PASSWORD: password
    volumes:
      - db_data:/var/lib/mysql
      - ./blog-init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - blog_network

  # Backend (PHP/Laravel)
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    volumes:
      - ./backend:/var/www
      - /var/www/vendor
    container_name: blog_backend
    restart: unless-stopped
    working_dir: /var/www
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=blog
      - DB_USERNAME=blog_user
      - DB_PASSWORD=password
    networks:
      - blog_network

  # Web сервер (Nginx) - обслуживает React SPA и проксирует API
  web:
    build:
      context: .
      dockerfile: docker/nginx.Dockerfile
    container_name: blog_web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      # Копируем конфигурацию nginx для обработки SPA и прокси
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      # Монтируем директорию фронтенда
      - ./frontend/dist:/usr/share/nginx/html
    depends_on:
      - backend
    networks:
      - blog_network

networks:
  blog_network:
    driver: bridge

volumes:
  db_data:


